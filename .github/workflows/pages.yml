name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply verified Google Maps refinements
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/app.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<div class="google-rating-score" dir="ltr">—</div>', '<div class="google-rating-score" dir="ltr">5.0</div>')
          s = s.replace('0 تقييم على Google', '86 تقييمًا على Google')
          s = s.replace('0 Google reviews', '86 Google reviews')
          s = s.replace('.google-rating-stars svg { width: 13px; height: 13px; }', '.google-rating-stars svg { width: 13px; height: 13px; fill: currentColor; stroke: currentColor; }')
          s = s.replace(
              'src="https://www.google.com/maps?q=Liwa%20Center%20Building%2C%20King%20Fahd%2C%20Riyadh%2012274%2C%20Saudi%20Arabia&output=embed"',
              'src="https://www.google.com/maps?q=Ahmad%20Al%20Hammadi%20Law%20Firm%2C%20Riyadh%2C%20Saudi%20Arabia&output=embed"'
          )
          s = s.replace(
              '      filter: saturate(.72) contrast(.96);\n    }',
              '      filter: saturate(.72) contrast(.96);\n      pointer-events: none;\n    }'
          )
          marker = "  document.querySelectorAll('[data-lang-switch]').forEach(btn => {"
          click_patch = """  const officeMapCard = document.querySelector('.office-map-card');
  if (officeMapCard) {
    officeMapCard.setAttribute('role', 'link');
    officeMapCard.setAttribute('tabindex', '0');
    officeMapCard.setAttribute('aria-label', 'Open Ahmad Al Hammadi Law Firm in Google Maps');
    officeMapCard.style.cursor = 'pointer';
    const openOfficeMap = () => window.open('https://maps.app.goo.gl/jYjyMW6sqA4fEF4r7?g_st=ic', '_blank', 'noopener');
    officeMapCard.addEventListener('click', openOfficeMap);
    officeMapCard.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openOfficeMap();
      }
    });
  }

"""
          if marker in s and 'const officeMapCard =' not in s:
              s = s.replace(marker, click_patch + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
