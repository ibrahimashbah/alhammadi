name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply verified Google Maps rating
        run: |
          sed -i 's/<div class="google-rating-score" dir="ltr">—<\/div>/<div class="google-rating-score" dir="ltr">5.0<\/div>/' assets/app.js
          sed -i 's/0 تقييم على Google/86 تقييمًا على Google/' assets/app.js
          sed -i 's/0 Google reviews/86 Google reviews/' assets/app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
