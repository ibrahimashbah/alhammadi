name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply verified Google Maps and consultation refinements
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/app.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<div class="google-rating-score" dir="ltr">—</div>', '<div class="google-rating-score" dir="ltr">5.0</div>')
          s = s.replace('0 تقييم على Google', '86 تقييمًا على Google')
          s = s.replace('0 Google reviews', '86 Google reviews')
          s = s.replace('.google-rating-stars svg { width: 13px; height: 13px; }', '.google-rating-stars svg { width: 13px; height: 13px; fill: currentColor; stroke: currentColor; }')
          s = s.replace('src="https://www.google.com/maps?q=Liwa%20Center%20Building%2C%20King%20Fahd%2C%20Riyadh%2012274%2C%20Saudi%20Arabia&output=embed"', 'src="https://www.google.com/maps?q=Ahmad%20Al%20Hammadi%20Law%20Firm%2C%20Riyadh%2C%20Saudi%20Arabia&output=embed"')
          s = s.replace('      filter: saturate(.72) contrast(.96);\n    }', '      filter: saturate(.72) contrast(.96);\n      pointer-events: none;\n    }')

          marker = "  document.querySelectorAll('[data-lang-switch]').forEach(btn => {"

          click_patch = "  const officeMapCard = document.querySelector('.office-map-card');\n  if (officeMapCard) {\n    officeMapCard.setAttribute('role', 'link');\n    officeMapCard.setAttribute('tabindex', '0');\n    officeMapCard.setAttribute('aria-label', 'Open Ahmad Al Hammadi Law Firm in Google Maps');\n    officeMapCard.style.cursor = 'pointer';\n    const openOfficeMap = () => window.open('https://maps.app.goo.gl/jYjyMW6sqA4fEF4r7?g_st=ic', '_blank', 'noopener');\n    officeMapCard.addEventListener('click', openOfficeMap);\n    officeMapCard.addEventListener('keydown', (e) => {\n      if (e.key === 'Enter' || e.key === ' ') {\n        e.preventDefault();\n        openOfficeMap();\n      }\n    });\n  }\n\n"
          if marker in s and 'const officeMapCard =' not in s:
              s = s.replace(marker, click_patch + marker, 1)

          consultation_patch = "  document.querySelectorAll('.hero .btn-primary[href=\"#contact\"], .link-arrow[href=\"#contact\"]').forEach(link => {\n    link.addEventListener('click', (ev) => {\n      ev.preventDefault();\n      ev.stopImmediatePropagation();\n      const message = html.lang === 'ar'\n        ? 'السلام عليكم، أحتاج استشارة قانونية.'\n        : 'Hello, I would like to request a legal consultation.';\n      window.open(`https://wa.me/966555334489?text=${encodeURIComponent(message)}`, '_blank', 'noopener');\n    });\n  });\n\n"
          if marker in s and 'أحتاج استشارة قانونية' not in s:
              s = s.replace(marker, consultation_patch + marker, 1)

          p.write_text(s, encoding='utf-8')

          css = Path('assets/styles.css')
          c = css.read_text(encoding='utf-8')
          alignment = '''

/* Locale-consistent metric alignment */
.metrics .metric {
  display: flex !important;
  flex-direction: column !important;
  justify-content: flex-start !important;
}
.metrics .metric > strong,
.metrics .metric > span {
  width: 100% !important;
  margin-inline: 0 !important;
}
html[dir="rtl"] .metrics .metric,
html[dir="rtl"] .metrics .metric > strong,
html[dir="rtl"] .metrics .metric > span {
  text-align: right !important;
}
html[dir="ltr"] .metrics .metric,
html[dir="ltr"] .metrics .metric > strong,
html[dir="ltr"] .metrics .metric > span {
  text-align: left !important;
}
'''
          if 'Locale-consistent metric alignment' not in c:
              c += alignment
          css.write_text(c, encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
