name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download KAFD hero locally
        run: |
          mkdir -p assets
          curl -L --fail --retry 3 --retry-delay 2 \
            -o assets/kafd-hero.jpg \
            "https://upload.wikimedia.org/wikipedia/commons/thumb/1/17/KAFD_59.jpg/1920px-KAFD_59.jpg"
          test -s assets/kafd-hero.jpg

      - name: Apply site refinements
        run: python .github/scripts/refine.py

      - name: Inject Google tracking
        run: python .github/scripts/inject_tracking.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
